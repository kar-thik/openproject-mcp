name: Compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'openproject_mcp/**'
      - 'tests/integration/**'
      - 'tests/conftest.py'
      - 'scripts/live_smoke.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/compatibility.yml'
  push:
    branches: [main]
    paths:
      - 'openproject_mcp/**'
      - 'tests/integration/**'
      - 'tests/conftest.py'
      - 'scripts/live_smoke.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/compatibility.yml'

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: OpenProject ${{ matrix.version }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version: ['14.6.0', '15.5.0', '16.6.0', '17.8.0']
        mode: ['multiple']
        include:
          - version: '17.8.0'
            mode: 'single'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Test a disposable instance
        run: uv run python scripts/live_smoke.py --image openproject/openproject:${{ matrix.version }} --version-mode ${{ matrix.mode }}
