name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv tags are immutable since v8 — pin the full version; Dependabot bumps it
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install (locked)
        run: uv sync --locked --group dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .

  typecheck:
    name: pyright (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"  # matches [tool.pyright] pythonVersion (the supported floor)
      - name: Install (locked)
        run: uv sync --locked --group dev
      - name: pyright
        run: uv run pyright

  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ["3.12", "3.13"]
        experimental: [false]
        include:
          # fastmcp installs on 3.14 (requires-python >=3.10) but does not yet
          # declare a 3.14 classifier. Non-blocking until this lane is stably green.
          - python: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
          cache-suffix: py${{ matrix.python }}
      - name: Install (locked)
        run: uv sync --locked --group dev
      - name: pytest (offline)
        run: uv run pytest -m "not integration"

  build:
    name: package build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Build sdist + wheel
        run: uv build
      - name: Validate metadata
        run: uvx twine check --strict dist/*
